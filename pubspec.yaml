name: cft_note
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  perfect_freehand: ^2.5.2
  file_picker: ^13.3.2
  pdfx: ^2.11.0
  path_provider: ^2.1.6
  syncfusion_flutter_pdf: ^35.1.43
  pdfrx: ^2.12.0
  cupertino_icons: ^2.0.0
  share_plus: ^13.3.1
  gal: ^3.0.0
  super_clipboard: ^0.10.0-dev.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.0
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  native_toolchain_rust: 1.0.4+0
  
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256